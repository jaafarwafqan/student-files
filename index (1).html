<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>دليل أضابير الطلبة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: search on top, then three filing cabinets drawn as real steel drawers; a drawer opens into its file list. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#17212b; --muted:#5b6773; --line:#d8dee5; --soft:#f4f6f8;
  --steel:#d6cfba; --steel-hi:#e4dec9; --steel-edge:#b0a88f; --slot:#fbfaf6; --mark:#ffe58a; --mark-ink:#17212b;
  --s2:#1d5fc4; --s3:#0f8a5f; --s4:#c9650c; --s2t:#e6eefb; --s3t:#e2f4ec; --s4t:#fbeedd;
  --k0:#9aa5b1; --k1:#b3261e; --k2:#0f8a5f; --k3:#8a5cc2; --k4:#1d5fc4; --k5:#c9650c; --k6:#6b7783; --k7:#c3cad2;
  --display:'Reem Kufi','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a222b; --ink:#e8edf2; --muted:#9aa7b4; --line:#2d3945; --soft:#212b35;
  --steel:#4b4a41; --steel-hi:#5a594e; --steel-edge:#2f2e28; --slot:#232c36; --mark:#8a6d00; --mark-ink:#fff;
  --s2:#6ea3f5; --s3:#3fc296; --s4:#f0994a; --s2t:#1b2a44; --s3t:#15322a; --s4t:#3a2a18;
  --k0:#7d8894; --k1:#f07a72; --k2:#3fc296; --k3:#b697e6; --k4:#6ea3f5; --k5:#f0994a; --k6:#9aa7b4; --k7:#56616d;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a222b; --ink:#e8edf2; --muted:#9aa7b4; --line:#2d3945; --soft:#212b35;
  --steel:#4b4a41; --steel-hi:#5a594e; --steel-edge:#2f2e28; --slot:#232c36; --mark:#8a6d00; --mark-ink:#fff;
  --s2:#6ea3f5; --s3:#3fc296; --s4:#f0994a; --s2t:#1b2a44; --s3t:#15322a; --s4t:#3a2a18;
  --k0:#7d8894; --k1:#f07a72; --k2:#3fc296; --k3:#b697e6; --k4:#6ea3f5; --k5:#f0994a; --k6:#9aa7b4; --k7:#56616d;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
.dm .top,.dm .search,.dm .hint,.dm #results,.dm #room,.dm #legend{display:none}
.dm .panel{border-top-width:0;padding:0;overflow:hidden;gap:0}
.dm .phead{background:var(--c);padding:16px 18px}
.dm .phead h3{color:var(--surface);font-size:26px}
.dm .phead p{color:var(--surface);opacity:.9}
.dm .org{font-size:12.5px;font-weight:600}
.dm .files,.dm .pf{margin:14px 18px}
.dm .pf{width:calc(100% - 36px)}
.pf{font:500 17px/1.4 var(--body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.pf:focus{border-color:var(--c)}
.files li.me{scroll-margin:80px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 20px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.3;margin:0;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:14px}
.top .cnt{font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{width:100%;font:500 18px/1.4 var(--body);padding:15px 50px 15px 46px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.search input::placeholder{color:var(--muted);font-weight:400}
.search input:focus{border-color:var(--s2)}
.search svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
.search button{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
.search button:focus-visible,.drawer:focus-visible,.back:focus-visible{outline:3px solid var(--s2);outline-offset:2px}
.hint{color:var(--muted);font-size:13.5px;margin:-10px 4px 0}
.s2{--c:var(--s2);--t:var(--s2t)}.s3{--c:var(--s3);--t:var(--s3t)}.s4{--c:var(--s4);--t:var(--s4t)}

/* results */
.results{display:flex;flex-direction:column;gap:10px}
.rhead{font-weight:600;font-size:14px;color:var(--muted)}
.hit{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.hit:hover{border-color:var(--c)}
.hit .nm{font-weight:600;font-size:17px;min-width:0;overflow-wrap:anywhere}
.hit mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.hit .meta{grid-column:1;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px;min-width:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;background:var(--k)}
.where{grid-column:2;grid-row:1 / span 3;display:flex;align-items:stretch;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--c);font-variant-numeric:tabular-nums}
.where div{padding:5px 12px;text-align:center;line-height:1.25}
.where small{display:block;font-size:11px;font-weight:500;opacity:.85}
.where b{font-family:var(--display);font-size:22px;font-weight:700}
.where .st{background:var(--c);color:var(--surface)}
.where .dr,.where .ps{color:var(--c);background:var(--t)}
.where .ps{border-inline-start:1px dashed var(--c)}
.depth{grid-column:1;height:6px;border-radius:3px;background:var(--soft);position:relative;margin-top:4px;max-width:340px}
.depth i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;background:var(--c);right:calc(var(--p)*1% - 2px)}
.depth:before,.depth:after{position:absolute;top:8px;font-size:10.5px;color:var(--muted)}
.depth:before{content:"الواجهة";right:0}.depth:after{content:"الخلف";left:0}
.hit .depth{margin-bottom:16px}
.none{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

/* cabinets */
.room{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2.4vw,22px);align-items:start}
.cab{display:flex;flex-direction:column;gap:8px;min-width:0}
.cab h2{font-family:var(--display);font-weight:700;font-size:clamp(15px,3.4vw,21px);margin:0;color:var(--c);line-height:1.4;text-align:center}
.cab h2 small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.body{background:var(--steel);border:2px solid var(--steel-edge);border-radius:8px;padding:clamp(5px,1.4vw,9px);display:flex;flex-direction:column;gap:clamp(5px,1.2vw,8px);box-shadow:0 10px 18px -12px rgba(0,0,0,.45)}
.drawer{position:relative;display:flex;flex-direction:column;gap:6px;align-items:stretch;background:var(--steel-hi);border:1.5px solid var(--steel-edge);border-radius:5px;padding:clamp(6px,1.6vw,10px);cursor:pointer;font:inherit;color:inherit;text-align:center;min-width:0;transition:transform .15s}
.drawer:hover{transform:translateY(-2px)}
.drawer.open{outline:3px solid var(--c);outline-offset:1px}
.drawer.dim{opacity:.45}
.card{background:var(--slot);border-radius:4px;border-top:4px solid var(--c);padding:5px 4px 6px;min-width:0}
.card b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(15px,3.6vw,20px);color:var(--c);line-height:1.3}
.card span{display:block;font-size:clamp(10.5px,2.6vw,13px);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card em{font-style:normal;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.handle{align-self:center;width:38%;height:7px;border-radius:2px;border:1.5px solid var(--steel-edge);background:var(--steel)}
.badge{position:absolute;top:-8px;left:-6px;min-width:26px;height:26px;border-radius:13px;background:var(--c);color:var(--surface);font-weight:700;font-size:13px;line-height:26px;padding:0 7px;font-variant-numeric:tabular-nums}

/* open drawer */
.panel{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.phead h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0;color:var(--c);line-height:1.4}
.phead p{margin:0;color:var(--muted);font-size:13.5px}
.back{font:600 13px var(--body);border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:7px 14px;cursor:pointer}
.files{list-style:none;margin:0;padding:0;columns:3 250px;column-gap:22px}
.files li{break-inside:avoid;display:grid;grid-template-columns:30px 1fr;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}
.files li.me{background:var(--mark);color:var(--mark-ink);border-radius:5px}
.files li.me .n,.files li.me small{color:var(--mark-ink)}
.files .n{color:var(--c);font-weight:700;font-size:12.5px;text-align:center;font-variant-numeric:tabular-nums}
.files .nm{font-weight:500;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.files small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:12.5px}
.foot{color:var(--muted);font-size:12.5px;text-align:center}
@media (max-width:520px){ .hit{grid-template-columns:1fr} .where{grid-column:1;grid-row:auto;justify-self:start} .hit .depth{order:5} }
@media (prefers-reduced-motion:reduce){ .drawer{transition:none} }
</style>

<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  // Arabic-insensitive folding; keeps a 1:1 character mapping so highlights line up with the original text
  function fold(s){ return s.replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[ً-ْـ]/g,' ').toLowerCase(); }
  function two(n){ return n.split(' ').slice(0,2).join(' '); }

  var all = [], total = 0, nd = 0;
  D.stages.forEach(function(s){ s.drawers.forEach(function(d){ nd++; d.st.forEach(function(r, i){
    all.push({name:r[0], f:fold(r[0]), ch:r[1], k:r[2], year:r[3], s:s, d:d, pos:i+1}); total++; }); }); });
  $('cnt').textContent = total + ' أضبارة · ' + nd + ' درجاً · ' + D.stages.length + ' مراحل';
  $('legend').innerHTML = D.cats.map(function(c, i){ return '<span><i class="dot" style="--k:var(--k'+i+')"></i>'+esc(c)+'</span>'; }).join('');

  var open = null, focus = null, dm = false, wrap = document.querySelector('.wrap');   // open drawer key, highlighted student

  function key(s, d){ return 'm' + s.n + '-d' + d.num; }

  function renderRoom(counts){
    $('room').innerHTML = D.stages.map(function(s){
      return '<div class="cab s'+s.n+'"><h2>المرحلة '+esc(s.stage)+'<small>'+s.drawers.reduce(function(a,d){return a+d.st.length;},0)+' أضبارة</small></h2><div class="body">' +
        s.drawers.map(function(d){
          var k = key(s,d), c = counts ? (counts[k]||0) : null;
          return '<button type="button" class="drawer'+(open===k?' open':'')+(counts && !c?' dim':'')+'" data-k="'+k+'" aria-label="الدرج '+d.num+' المرحلة '+esc(s.stage)+'">' +
            (c ? '<span class="badge">'+c+'</span>' : '') +
            '<span class="card"><b>الدرج '+d.num+'</b><span>'+esc(two(d.st[0][0]))+'</span><span>↓</span><span>'+esc(two(d.st[d.st.length-1][0]))+'</span><em>'+d.st.length+' أضبارة</em></span><span class="handle"></span></button>';
        }).join('') + '</div></div>';
    }).join('');
  }

  function find(k){ var r=null; D.stages.forEach(function(s){ s.drawers.forEach(function(d){ if(key(s,d)===k) r={s:s,d:d}; }); }); return r; }

  function renderPanel(){
    var p = $('panel'), x = open && find(open);
    if(!x){ p.hidden = true; return; }
    p.hidden = false; p.className = 'panel s' + x.s.n;
    p.innerHTML = '<div class="phead"><div>'+(dm?'<p class="org">كلية التمريض · جامعة الكوفة · الدراسة المسائية</p>':'')+'<h3>المرحلة '+esc(x.s.stage)+' · الدرج '+x.d.num+'</h3><p>'+x.d.st.length+' أضبارة · من '+esc(two(x.d.st[0][0]))+' إلى '+esc(two(x.d.st[x.d.st.length-1][0]))+'</p></div><button type="button" class="back" id="close">'+(dm?'الدليل الكامل والبحث في كل الأدراج':'إغلاق الدرج')+'</button></div>' +
      (dm?'<input id="pf" class="pf" type="text" inputmode="search" autocomplete="off" placeholder="ابحث داخل هذا الدرج…" aria-label="بحث داخل الدرج">':'') +
      '<ol class="files">' + x.d.st.map(function(r, i){
        return '<li'+(focus===open+':'+(i+1)?' class="me" id="me"':'')+' data-f="'+esc(fold(r[0]))+'"><span class="n">'+(i+1)+'</span><span class="nm">'+esc(r[0])+'<small><i class="dot" style="--k:var(--k'+r[2]+')"></i>'+esc(r[1]||'القناة غير مذكورة')+' · '+esc(r[3])+'</small></span></li>';
      }).join('') + '</ol>';
  }

  function hl(name, toks){
    var f = fold(name), on = [];
    toks.forEach(function(t){ var i = f.indexOf(t); while(i >= 0){ for(var j=i;j<i+t.length;j++) on[j]=1; i = f.indexOf(t, i+1); } });
    var out = '', inM = false;
    for(var i=0;i<name.length;i++){ if(on[i] && !inM){ out+='<mark>'; inM=true; } if(!on[i] && inM){ out+='</mark>'; inM=false; } out += esc(name[i]); }
    return out + (inM ? '</mark>' : '');
  }

  function search(){
    var q = $('q').value.trim(), box = $('results');
    $('clr').hidden = !q;
    if(!q){ box.hidden = true; renderRoom(null); return; }
    var toks = fold(q).split(/\s+/).filter(Boolean);
    var hits = all.filter(function(a){ return toks.every(function(t){ return a.f.indexOf(t) >= 0; }); });
    // names starting with the first word come first
    hits.sort(function(a,b){ return (a.f.indexOf(toks[0])===0?0:1) - (b.f.indexOf(toks[0])===0?0:1); });
    var counts = {}; hits.forEach(function(h){ var k = key(h.s,h.d); counts[k] = (counts[k]||0)+1; });
    box.hidden = false;
    if(!hits.length){ box.innerHTML = '<div class="none">لا توجد أضبارة بهذا الاسم. جرّب اسماً واحداً فقط أو تهجئة أخرى.</div>'; renderRoom(counts); return; }
    var shown = hits.slice(0, 40);
    box.innerHTML = '<div class="rhead">'+hits.length+' نتيجة'+(hits.length>shown.length?' · المعروض أول '+shown.length+'، أضف اسماً آخر للتضييق':'')+'</div>' +
      shown.map(function(h){
        var p = h.d.st.length > 1 ? Math.round((h.pos-1)/(h.d.st.length-1)*100) : 0;
        return '<button type="button" class="hit s'+h.s.n+'" data-k="'+key(h.s,h.d)+'" data-p="'+h.pos+'">' +
          '<span class="nm">'+hl(h.name, toks)+'</span>' +
          '<span class="where"><div class="st"><small>المرحلة</small><b>'+h.s.n+'</b></div><div class="dr"><small>الدرج</small><b>'+h.d.num+'</b></div><div class="ps"><small>التسلسل</small><b>'+h.pos+'</b></div></span>' +
          '<span class="meta"><span><i class="dot" style="--k:var(--k'+h.k+')"></i>'+esc(h.ch||'القناة غير مذكورة')+'</span><span>سنة القبول '+esc(h.year)+'</span><span>'+h.pos+' من '+h.d.st.length+'</span></span>' +
          '<span class="depth" style="--p:'+p+'"><i></i></span></button>';
      }).join('');
    renderRoom(counts);
  }

  function openDrawer(k, pos){
    open = k; focus = pos ? k + ':' + pos : null;
    renderPanel(); search();
    var t = $('me') || $('panel');
    if(t && t.scrollIntoView) t.scrollIntoView({block: $('me') ? 'center' : 'start', behavior:'smooth'});
    try{ history.replaceState(null, '', '#' + k); }catch(e){}
  }

  $('q').addEventListener('input', search);
  $('clr').addEventListener('click', function(){ $('q').value=''; search(); $('q').focus(); });
  $('room').addEventListener('click', function(e){ var b = e.target.closest('.drawer'); if(b) openDrawer(b.dataset.k); });
  $('results').addEventListener('click', function(e){ var b = e.target.closest('.hit'); if(b) openDrawer(b.dataset.k, b.dataset.p); });
  $('panel').addEventListener('click', function(e){ if(e.target.id==='close'){ open=null; focus=null; dm=false; wrap.classList.remove('dm'); window.scrollTo(0,0); renderPanel(); search(); try{ history.replaceState(null,'','#'); }catch(x){} } });

  $('panel').addEventListener('input', function(e){ if(e.target.id!=='pf') return;
    var t = fold(e.target.value.trim()).split(/\s+/).filter(Boolean);
    [].forEach.call($('panel').querySelectorAll('.files li'), function(li){ li.hidden = !t.every(function(x){ return li.dataset.f.indexOf(x) >= 0; }); }); });
  function fromHash(){ var h = (location.hash||'').slice(1);
    if(h && find(h)){ open = h; focus = null; dm = true; wrap.classList.add('dm'); $('q').value = ''; renderPanel(); search(); window.scrollTo(0,0); return true; } return false; }
  window.addEventListener('hashchange', fromHash);
  if(!fromHash()){ renderPanel(); search(); }
})();
</script>
</body></html>
